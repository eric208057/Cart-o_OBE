<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mapa Força - Sistema OBE</title>
    <style>
        body { 
            margin:0; padding:0; 
            font-family:Arial, sans-serif; 
            background:#000; 
            color:#fff; 
            min-height:100vh; 
            display:flex; 
            flex-direction:column; 
        }
        header { 
            background:#1a1a1a; 
            padding:20px; 
            text-align:center; 
            border-bottom:2px solid #333; 
            position: relative;
        }
        h1 { margin:0; font-size:2.4rem; }
        .back-btn { 
            position: absolute;
            left: 20px;
            top: 20px;
            padding: 10px 20px;
            background: #333;
            color: white;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1rem;
            z-index: 10;
        }
        .back-btn:hover { background: #555; }

        .container { 
            padding: 30px 20px; 
            text-align: center; 
            flex: 1; 
        }

        .section { margin: 40px 0; }
        .section h2 { 
            font-size: 1.8rem; 
            margin-bottom: 20px; 
            color: #ccc; 
            border-bottom: 1px solid #444; 
            padding-bottom: 10px; 
        }

        .buttons-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); 
            gap: 18px; 
            max-width: 1200px; 
            margin: 0 auto; 
        }

        .btn { 
            background: #1a1a1a; 
            color: white; 
            padding: 25px 15px; 
            font-size: 1.3rem; 
            font-weight: bold; 
            text-decoration: none; 
            border-radius: 12px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.6); 
            border: 2px solid transparent; 
            display: block; 
            cursor: pointer;
        }
        .btn:hover { transform: translateY(-5px); }

        .pop-btn { border-color: #8B0000; }
        .vtr-btn { border-color: #006400; }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.92);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #111;
            padding: 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 420px;
            border: 1px solid #444;
            text-align: center;
        }
        .modal-content h3 {
            margin-top: 0;
            color: #aaa;
        }
        .modal-content p {
            margin: 10px 0 20px;
            color: #888;
            font-size: 1.1rem;
        }
        .modal-content input {
            width: 100%;
            padding: 14px;
            font-size: 1.3rem;
            margin: 15px 0;
            background: #222;
            border: 1px solid #555;
            color: white;
            border-radius: 6px;
            text-align: center;
            letter-spacing: 2px;
        }
        .modal-content button {
            padding: 14px 30px;
            font-size: 1.2rem;
            background: #006400;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 0 10px;
        }
        .modal-content button.cancel {
            background: #8B0000;
        }

        footer { 
            text-align: center;
            padding: 15px;
            background: #1a1a1a;
            font-size: 0.8rem;
            color: #888;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="back-btn">← Voltar ao Menu Principal</a>
        <h1>Relatório de Serviço Operacional (RSO)</h1>
    </header>

    <div class="container">

        <div class="section">
            <h2>POP's</h2>
            <div class="buttons-grid">
                <!-- Seus botões POP aqui (exemplo com alguns) -->
                <a href="#" data-url="https://docs.google.com/spreadsheets/d/1UKidL70wnkV1gtoiXiXdjlMROTLLSUPkW2zQQ6HrGS4/edit?gid=401673012#gid=401673012" data-key="pop-1" class="btn pop-btn">POP-1</a>
                <a href="#" data-url="https://docs.google.com/spreadsheets/d/1UKidL70wnkV1gtoiXiXdjlMROTLLSUPkW2zQQ6HrGS4/edit?gid=890314411#gid=890314411" data-key="pop-2" class="btn pop-btn">POP-2</a>
                <!-- ... coloque todos os outros POPs ... -->
            </div>
        </div>

        <div class="section">
            <h2>VTR's</h2>
            <div class="buttons-grid">
                <a href="#" data-url="https://docs.google.com/spreadsheets/d/1UKidL70wnkV1gtoiXiXdjlMROTLLSUPkW2zQQ6HrGS4/edit?gid=720536994#gid=720536994" data-key="vtr-cmt-cia" class="btn vtr-btn">Cmt Cia</a>
                <!-- ... coloque todos os outros VTRs ... -->
            </div>
        </div>

    </div>

    <!-- Modal de senha -->
    <div id="passwordModal" class="modal">
        <div class="modal-content">
            <h3>Autenticação Necessária</h3>
            <p id="itemName"></p>
            <input type="password" id="passwordInput" placeholder="Digite a senha" autocomplete="off">
            <div style="margin-top: 25px;">
                <button id="btnConfirmar">Entrar</button>
                <button class="cancel" onclick="closeModal()">Cancelar</button>
            </div>
        </div>
    </div>

    <footer>Sistema de Informação OBE • 2025</footer>

    <script>
        let senhas = null;
        let currentUrl = '';
        let currentSenhaCorreta = '';
        let popupBlockerBypass = null;  // Armazena referência ao window.open inicial

        // Carregar senhas
        async function carregarSenhas() {
            try {
                const resposta = await fetch('senhas.json', { cache: 'no-store' });
                if (!resposta.ok) throw new Error(`HTTP ${resposta.status}`);
                senhas = await resposta.json();
                console.log("Senhas carregadas com sucesso");
            } catch (erro) {
                console.error("Erro ao carregar senhas:", erro);
                alert("Não foi possível carregar as senhas. Verifique senhas.json");
            }
        }

        carregarSenhas();

        // Configura todos os botões
        document.querySelectorAll('.buttons-grid a[data-key]').forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();

                if (!senhas) {
                    alert("Senhas ainda carregando... Aguarde.");
                    return;
                }

                const key = this.getAttribute('data-key');
                currentUrl = this.getAttribute('data-url');
                currentSenhaCorreta = senhas[key];

                if (!currentSenhaCorreta) {
                    alert("Senha não configurada para este item.");
                    return;
                }

                // TRUQUE ANTI-BLOQUEADOR: abre uma janela vazia imediatamente (permitido)
                popupBlockerBypass = window.open('about:blank', '_blank');

                const nomeItem = this.textContent.trim();
                document.getElementById('itemName').textContent = nomeItem;
                document.getElementById('passwordModal').style.display = 'flex';
                document.getElementById('passwordInput').value = '';
                document.getElementById('passwordInput').focus();
            });
        });

        // Botão Confirmar (melhor usar addEventListener do que onclick inline)
        document.getElementById('btnConfirmar').addEventListener('click', function() {
            const digitada = document.getElementById('passwordInput').value.trim();

            if (digitada === currentSenhaCorreta) {
                closeModal();

                // Agora usamos a janela já aberta (não será bloqueada)
                if (popupBlockerBypass && !popupBlockerBypass.closed) {
                    popupBlockerBypass.location.href = currentUrl;
                } else {
                    // Fallback caso tenha sido fechada ou bloqueada
                    window.open(currentUrl, '_blank');
                }
            } else {
                alert('Senha incorreta!');
                document.getElementById('passwordInput').value = '';
                document.getElementById('passwordInput').focus();
            }
        });

        function closeModal() {
            document.getElementById('passwordModal').style.display = 'none';
            currentUrl = '';
            currentSenhaCorreta = '';
            // Não fechamos popupBlockerBypass aqui, só redirecionamos depois
        }

        // Fechar com ESC
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
            }
        });
    </script>

</body>
</html>
