<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patrulha Runner - POP-01</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: #0a0a0a;
            color: #eee;
            font-family: Arial, Helvetica, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #game-container {
            position: relative;
            z-index: 1;
        }

        canvas {
            background: #111;
            border: 2px solid #333;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(0,0,0,0.9);
        }

        #score {
            position: absolute;
            top: 20px;
            right: 25px;
            font-size: 2rem;
            font-weight: bold;
            color: #4fc3f7;
            text-shadow: 0 0 10px #000;
            z-index: 10;
        }

        #game-over {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #ff4444;
            font-size: 3.2rem;
            font-weight: bold;
            text-shadow: 0 0 15px #000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s;
            z-index: 20;
        }

        #game-over.show {
            opacity: 1;
            pointer-events: all;
        }

        #game-over button {
            margin-top: 30px;
            padding: 14px 40px;
            font-size: 1.5rem;
            background: #0288d1;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        #game-over button:hover {
            background: #0277bd;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="score">00000</div>
    <canvas id="canvas" width="800" height="300"></canvas>
    <div id="game-over">
        FIM DA OPERAÇÃO<br>
        <span style="font-size:1.5rem; color:#bbb; margin:25px 0;">Pontuação: <span id="final-score">0</span></span>
        <button onclick="location.reload()">Tentar Novamente</button>
    </div>
</div>

<script>
// Patrulha Runner - POP-01 (créditos em 3 linhas + título)

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const gameOverEl = document.getElementById('game-over');
const finalScoreEl = document.getElementById('final-score');

let score = 0;
let gameSpeed = 5;
let gravity = 0.6;
let isGameOver = false;
let frame = 0;

const groundY = canvas.height - 40;

// Créditos divididos em 3 linhas + título no início
const creditsLine1 = "EQUIPE OBE CFS II/25 • AL Sgt PM DANIEL CMT • AL Sgt PM RAFAEL SUB CMT • AL Sgt PM GRANATA P1 • AL Sgt PM LELIS P1 • ";
const creditsLine2 = "AL Sgt PM NASCIMENTO P2 • AL Sgt PM LAVEZZO P2 • AL Sgt PM CERVANTES P2 • AL Sgt PM MAGALHAES P3 • AL Sgt PM FERNANDES P3 • AL Sgt PM LIN P3 • ";
const creditsLine3 = "AL Sgt PM ZULENE P4 • AL Sgt PM MARTINS P4 • AL Sgt PM MICHEL FELIX P4 • AL Sgt PM MARTA P5 • AL Sgt PM FERNANDA P5 • AL Sgt PM TEIXEIRA Telemática • AL Sgt PM ROMAO Telemática • ";

let creditsX = canvas.width;

let player = {
    x: 80,
    y: groundY - 32,
    width: 32,
    baseHeight: 32,
    duckHeight: 20,
    dy: 0,
    jumping: false,
    ducking: false
};

function getPlayerHitbox() {
    const offsetY = player.ducking ? player.baseHeight - player.duckHeight : 0;
    return {
        x: player.x,
        y: player.y + offsetY,
        width: player.width,
        height: player.ducking ? player.duckHeight : player.baseHeight
    };
}

function drawPixelPlayer() {
    ctx.save();
    ctx.translate(player.x + player.width / 2, player.y + player.baseHeight / 2);
    
    if (player.ducking) {
        ctx.scale(1, player.duckHeight / player.baseHeight);
    }

    ctx.fillStyle = '#1e88e5';
    ctx.fillRect(-12, -16, 24, 32);

    ctx.fillStyle = '#ffdbac';
    ctx.fillRect(-8, -24, 16, 16);
    
    ctx.fillStyle = '#ffeb3b';
    ctx.fillRect(-10, -26, 20, 10);
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    ctx.strokeRect(-10, -26, 20, 10);

    ctx.fillStyle = '#000';
    ctx.fillRect(-6, -20, 4, 4);
    ctx.fillRect(2, -20, 4, 4);

    ctx.fillStyle = '#1e88e5';
    ctx.fillRect(-16, -12, 8, 16);
    ctx.fillRect(8, -12, 8, 16);

    ctx.fillStyle = '#fff';
    ctx.fillRect(-4, -8, 8, 8);
    ctx.fillStyle = '#d32f2f';
    ctx.fillRect(-3, -7, 6, 6);

    ctx.restore();
}

let obstacles = [];

function createObstacle() {
    const isBird = Math.random() < 0.4;
    let obs = {
        x: canvas.width + 50,
        width: 32,
        height: isBird ? 28 : 48,
        type: isBird ? 'bird' : 'cactus'
    };

    if (isBird) {
        obs.y = groundY - 90 - Math.random() * 70;
    } else {
        obs.y = groundY;
    }

    obstacles.push(obs);
}

function drawObstacles() {
    obstacles.forEach(obs => {
        ctx.fillStyle = obs.type === 'bird' ? '#555' : '#616161';
        
        if (obs.type === 'cactus') {
            ctx.fillRect(obs.x, obs.y - obs.height, obs.width, obs.height);
            ctx.fillRect(obs.x + 8, obs.y - obs.height - 20, 16, 20);
        } else {
            ctx.fillRect(obs.x, obs.y - obs.height/2, obs.width, obs.height/2);
            ctx.fillRect(obs.x + 4, obs.y - obs.height*0.8, obs.width-8, obs.height*0.6);
        }
    });
}

function updateObstacles() {
    const playerBox = getPlayerHitbox();

    for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.x -= gameSpeed;

        if (
            playerBox.x < obs.x + obs.width &&
            playerBox.x + playerBox.width > obs.x &&
            playerBox.y < obs.y &&
            playerBox.y + playerBox.height > obs.y - obs.height
        ) {
            isGameOver = true;
        }

        if (obs.x + obs.width < -50) {
            obstacles.splice(i, 1);
            score += 20;
        }
    }
}

function drawGround() {
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

    ctx.strokeStyle = '#444';
    ctx.lineWidth = 5;
    const offset = (frame * gameSpeed) % 100;
    for (let x = -100 + offset; x < canvas.width + 100; x += 100) {
        ctx.beginPath();
        ctx.moveTo(x, groundY);
        ctx.lineTo(x + 50, groundY);
        ctx.stroke();
    }
}

function drawCreditsBackground() {
    ctx.save();
    ctx.globalAlpha = 0.25;
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 22px Arial';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    
    const extraSpace = canvas.width * 3;  // espaçamento ainda maior
    
    // Linha 1 (título + CMT/SUB + P1)
    ctx.fillText(creditsLine1, creditsX, canvas.height / 2 - 30);
    ctx.fillText(creditsLine1, creditsX + extraSpace, canvas.height / 2 - 30);
    
    // Linha 2 (P2 + P3)
    ctx.fillText(creditsLine2, creditsX, canvas.height / 2);
    ctx.fillText(creditsLine2, creditsX + extraSpace, canvas.height / 2);
    
    // Linha 3 (P4 + P5 + Telemática)
    ctx.fillText(creditsLine3, creditsX, canvas.height / 2 + 30);
    ctx.fillText(creditsLine3, creditsX + extraSpace, canvas.height / 2 + 30);
    
    ctx.restore();
}

function update() {
    if (isGameOver) {
        gameOverEl.classList.add('show');
        finalScoreEl.textContent = score.toString().padStart(5, '0');
        return;
    }

    frame++;
    if (frame % 3 === 0) score++;
    scoreEl.textContent = score.toString().padStart(5, '0');

    player.dy += gravity;
    player.y += player.dy;

    if (player.y > groundY - player.baseHeight) {
        player.y = groundY - player.baseHeight;
        player.dy = 0;
        player.jumping = false;
    }

    if (score % 1800 === 0) gameSpeed += 0.2;

    if (frame % 140 === 0 || Math.random() < 0.006) {
        createObstacle();
    }

    updateObstacles();

    creditsX -= gameSpeed;
    
    const textWidth = Math.max(
        ctx.measureText(creditsLine1).width,
        ctx.measureText(creditsLine2).width,
        ctx.measureText(creditsLine3).width
    );
    
    if (creditsX < -textWidth - canvas.width * 2) {
        creditsX = canvas.width;
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    drawCreditsBackground();
    drawGround();
    drawPixelPlayer();
    drawObstacles();
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

document.addEventListener('keydown', e => {
    if (isGameOver) return;

    if ((e.code === 'Space' || e.code === 'ArrowUp') && !player.jumping) {
        player.dy = -14;
        player.jumping = true;
    }

    if (e.code === 'ArrowDown') {
        player.ducking = true;
    }
});

document.addEventListener('keyup', e => {
    if (e.code === 'ArrowDown') {
        player.ducking = false;
    }
});

canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    if (!player.jumping && !isGameOver) {
        player.dy = -14;
        player.jumping = true;
    }
});

loop();
</script>
</body>
</html>
